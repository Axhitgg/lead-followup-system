services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lead_db
      POSTGRES_USER: lead_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lead_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lead_user -d lead_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "5060:5060"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LEAD_API_KEY: ${LEAD_API_KEY}
      DATABASE_URL: postgresql://lead_user:${POSTGRES_PASSWORD}@db:5432/lead_db
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5060/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lead_postgres_data:
